<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1040" height="600" fill="#ffffff"/>

  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">SuperScalar pipeline — 9 stages</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#4b5563">Out-of-order superscalar processor with reorder buffer (ROB) · ECE 463/563, Project #3</text>

  <!-- Stage boxes -->
  <g font-size="14" font-weight="600" fill="#111827" text-anchor="middle">
    <g>
      <rect x="22" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="72" y="94">Fetch</text>
      <text x="72" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH / cycle</text>
      <rect x="134" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="184" y="94">Decode</text>
      <text x="184" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH / cycle</text>
      <rect x="246" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="296" y="94">Rename</text>
      <text x="296" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH / cycle</text>
      <rect x="358" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="408" y="94">Register Read</text>
      <text x="408" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH / cycle</text>
      <rect x="470" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="520" y="94">Dispatch</text>
      <text x="520" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH / cycle</text>
      <rect x="582" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="632" y="94">Issue Queue</text>
      <text x="632" y="113" font-size="11" font-weight="400" fill="#374151">IQ_SIZE entries</text>
      <rect x="694" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="744" y="94">Execute</text>
      <text x="744" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH × 5 in flight</text>
      <rect x="806" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="856" y="94">Writeback</text>
      <text x="856" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH × 5 / cycle</text>
      <rect x="918" y="72" width="100" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
      <text x="968" y="94">Retire</text>
      <text x="968" y="113" font-size="11" font-weight="400" fill="#374151">WIDTH / cycle</text>
    </g>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#4b5563" stroke-width="1.5" fill="none">
    <line x1="122" y1="99" x2="132" y2="99" marker-end="url(#arr)"/>
    <line x1="234" y1="99" x2="244" y2="99" marker-end="url(#arr)"/>
    <line x1="346" y1="99" x2="356" y2="99" marker-end="url(#arr)"/>
    <line x1="458" y1="99" x2="468" y2="99" marker-end="url(#arr)"/>
    <line x1="570" y1="99" x2="580" y2="99" marker-end="url(#arr)"/>
    <line x1="682" y1="99" x2="692" y2="99" marker-end="url(#arr)"/>
    <line x1="794" y1="99" x2="804" y2="99" marker-end="url(#arr)"/>
    <line x1="906" y1="99" x2="916" y2="99" marker-end="url(#arr)"/>
  </g>

  <!-- Pipeline register note -->
  <text x="520" y="152" text-anchor="middle" font-size="12.5" fill="#4b5563">Pipeline registers between stages: DE · RN · RR · DI = WIDTH &#160;·&#160; IQ = IQ_SIZE &#160;·&#160; execute_list, WB = WIDTH×5 &#160;·&#160; ROB = ROB_SIZE</text>
  <text x="520" y="172" text-anchor="middle" font-size="12.5" fill="#4b5563">Stages run in reverse order each cycle (Retire → … → Fetch), so a bundle advances at most one stage per cycle.</text>

  <!-- RMT box -->
  <rect x="196" y="198" width="200" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="296" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Rename Map Table (RMT)</text>
  <text x="296" y="242" text-anchor="middle" font-size="12" fill="#374151">67 entries (r0–r66)</text>
  <text x="296" y="260" text-anchor="middle" font-size="12" fill="#374151">Sources renamed to ROB tags;</text>
  <text x="296" y="278" text-anchor="middle" font-size="12" fill="#374151">dest allocates a new ROB entry</text>
  <line x1="296" y1="198" x2="296" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- IQ box -->
  <rect x="532" y="198" width="200" height="104" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="632" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Issue Queue (IQ)</text>
  <text x="632" y="242" text-anchor="middle" font-size="12" fill="#374151">IQ_SIZE entries</text>
  <text x="632" y="260" text-anchor="middle" font-size="12" fill="#374151">Waits until both sources ready;</text>
  <text x="632" y="278" text-anchor="middle" font-size="12" fill="#374151">issues up to WIDTH ready instrs/cycle</text>
  <line x1="632" y1="198" x2="632" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Execute / WB box -->
  <rect x="762" y="198" width="220" height="104" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="872" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Execute list + Writeback</text>
  <text x="872" y="242" text-anchor="middle" font-size="12" fill="#374151">WIDTH universal pipelined FUs</text>
  <text x="872" y="260" text-anchor="middle" font-size="12" fill="#374151">Latencies — op 0: 1 cycle,</text>
  <text x="872" y="278" text-anchor="middle" font-size="12" fill="#374151">op 1: 2 cycles, op 2: 5 cycles</text>
  <line x1="744" y1="198" x2="744" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="856" y1="198" x2="856" y2="128" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ROB box -->
  <rect x="22" y="330" width="996" height="118" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Reorder Buffer (ROB) — ROB_SIZE entries</text>
  <text x="520" y="378" text-anchor="middle" font-size="12.5" fill="#374151">Allocated at Rename — one entry per instruction, including instructions with no destination register.</text>
  <text x="520" y="398" text-anchor="middle" font-size="12.5" fill="#374151">Marked ready at Writeback; completion wakes up dependent instructions in the IQ, Dispatch, and Register Read stages.</text>
  <text x="520" y="418" text-anchor="middle" font-size="12.5" fill="#374151">Retired in program order from the head (up to WIDTH/cycle); retiring frees the RMT entry and shifts the ROB tags.</text>
  <text x="520" y="438" text-anchor="middle" font-size="12.5" fill="#374151">ROB tags are 100 + position in the ROB.</text>

  <!-- ROB side arrows -->
  <line x1="150" y1="126" x2="150" y2="328" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="150" y="240" text-anchor="middle" font-size="11.5" fill="#4b5563" transform="rotate(-90 150 240)">allocate at Rename</text>
  <line x1="1000" y1="126" x2="1000" y2="328" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="1000" y="240" text-anchor="middle" font-size="11.5" fill="#4b5563" transform="rotate(-90 1000 240)">retire in order</text>

  <!-- Bottom notes -->
  <text x="520" y="482" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">In-order fetch, decode, rename, register-read, dispatch · out-of-order issue &amp; execute · in-order retire</text>
  <text x="520" y="506" text-anchor="middle" font-size="12.5" fill="#4b5563">Assumes perfect caches and perfect branch prediction (per the project spec). Register values are not modeled —</text>
  <text x="520" y="524" text-anchor="middle" font-size="12.5" fill="#4b5563">only timing and dependencies matter. 67 architectural registers: 32 integer + 32 floating-point + HI/LO + FCC.</text>
  <text x="520" y="556" text-anchor="middle" font-size="12" fill="#6b7280">Trace format: &lt;PC in hex&gt; &lt;op type 0|1|2&gt; &lt;dest 0–66 or −1&gt; &lt;src1&gt; &lt;src2&gt; &#160;·&#160; −1 means “no register”.</text>
</svg>
